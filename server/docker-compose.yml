services:
  livekit:
    image: livekit/livekit-server:v1.9.0
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7880:7880"
      - "7881:7881"
      - "50000-50020:50000-50020/udp"
    restart: unless-stopped

  token:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      - livekit
    restart: unless-stopped
