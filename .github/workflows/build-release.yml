
name: MH Tour - Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android project
        id: locate
        shell: bash
        run: |
          echo "Mencari Gradle Wrapper..."

          GRADLEW="$(find . -type f -name gradlew \
            -not -path '*/.git/*' -print -quit)"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: File gradlew tidak ditemukan."
            echo "Isi repository:"
            ls -la
            find . -maxdepth 4 -type f \
              \( -name 'settings.gradle' \
              -o -name 'settings.gradle.kts' \
              -o -name 'gradlew' \) -print
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          if [ ! -f "$PROJECT_DIR/settings.gradle" ] && \
             [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle tidak ditemukan di $PROJECT_DIR"
            exit 1
          fi

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyek ditemukan: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon clean assembleRelease

      - name: Find generated APK
        id: apk
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          APK="$(find app/build/outputs/apk/release \
            -type f -name '*.apk' -print -quit 2>/dev/null)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK release tidak ditemukan."
            exit 1
          fi

          echo "apk_path=$APK" >> "$GITHUB_OUTPUT"
          ls -lh "$APK"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MH-Tour-Release-APK
          path: ${{ steps.locate.outputs.project_dir }}/${{ steps.apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14
